[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atrea-modbus"
version = "0.1.0"
description = "Read and control Atrea ventilation units over Modbus as typed Python objects."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "atrea-modbus contributors" }]
keywords = ["modbus", "atrea", "duplex", "rd5", "ventilation", "hvac", "home-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
# Callers inject the unit; tmodbus is the backend tests and the query script run against.
dependencies = ["modbus-connection[tmodbus]>=4.12.7"]

[project.urls]
Homepage = "https://github.com/mstefany/atrea-modbus"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atrea_modbus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
ignore = ["D107", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "D104"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "script"]
strict = true
